<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Black Matrículas 2027 | Bambinno</title><style>:root{--azul:#103b83;--vermelho:#e33342}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 15% 10%,#dcecff,transparent 40%),linear-gradient(145deg,#0d3477,#10265c);font-family:Arial,sans-serif;padding:20px}.card{width:min(100%,470px);background:white;border-radius:24px;padding:36px 25px;text-align:center;box-shadow:0 20px 65px #061c4688;position:relative;overflow:hidden}.tag{color:var(--vermelho);font-weight:900;letter-spacing:2px}.school{font-size:32px;font-weight:900;color:var(--azul);margin:12px 0 0}.year{font-size:19px;color:#526582;margin-bottom:25px}.brand{display:block;width:min(100%,310px);height:auto;margin:18px auto 12px}.gift{font-size:75px;margin:15px 0;transition:transform .5s}.heading{color:var(--azul);font-size:26px;font-weight:800}.description{color:#43536d;line-height:1.5}button{border:0;background:var(--vermelho);color:white;padding:17px 25px;border-radius:14px;font-weight:800;font-size:17px;cursor:pointer;width:100%;margin-top:15px}button:disabled{opacity:.6}.prize{display:none;background:#eff5ff;border:2px solid #d6e5ff;padding:22px 15px;border-radius:16px;color:var(--azul);font-weight:800;font-size:21px;line-height:1.4;margin-top:18px}.footer{margin-top:24px;color:#74829a;font-size:12px}.confetti{position:absolute;top:-20px;width:9px;height:15px;animation:fall 2.5s linear forwards}@keyframes fall{to{transform:translateY(680px) rotate(720deg)}}@media(prefers-reduced-motion:reduce){.confetti{animation:none;display:none}}</style></head><body><main class="card" id="card"><div class="tag">BLACK MATRÍCULAS</div><img class="brand" src="logo-bambinno.png" alt="Bambinno 2027 — Grande no que realmente importa"><div class="gift" id="gift">🎁</div><div class="heading" id="heading">Uma surpresa espera por você!</div><p class="description" id="description">Toque no botão para descobrir o seu presente especial.</p><button id="reveal">REVELAR MEU PRESENTE</button><div class="prize" id="prize" aria-live="polite"></div><div class="footer">Apresente esta tela à secretaria para registrar seu brinde.</div></main><script>
const premios={
'BMB27-A1':'Livro de Robótica',
'BMB27-C8':'Kit bilíngue – Educação Infantil',
'BMB27-F3':'Kit de livros didáticos – Educação Infantil',
'BMB27-J6':'Kit de livros didáticos – Ensino Fundamental',
'BMB27-M2':'Fardamento completo – Ensino Fundamental',
'BMB27-P9':'Fardamento completo – Educação Infantil',
'BMB27-R4':'Casaco – Educação Infantil',
'BMB27-T7':'Casaco – Ensino Fundamental',
'BMB27-U5':'Copo personalizado da Escola Bambinno',
'BMB27-V2':'Copo personalizado da Escola Bambinno',
'BMB27-W8':'Copo personalizado da Escola Bambinno',
'BMB27-X1':'Copo personalizado da Escola Bambinno',
'BMB27-Y9':'Copo personalizado da Escola Bambinno',
'BMB27-Z3':'Copo personalizado da Escola Bambinno'};
const codigo=new URLSearchParams(location.search).get('c');const botao=document.getElementById('reveal');if(!premios[codigo]){document.getElementById('heading').textContent='Código não identificado';document.getElementById('description').textContent='Solicite auxílio à secretaria da escola.';botao.style.display='none'}else{botao.addEventListener('click',()=>{botao.disabled=true;botao.textContent='ABRINDO SEU PRESENTE...';document.getElementById('gift').style.transform='scale(1.25) rotate(-8deg)';setTimeout(()=>{document.getElementById('gift').textContent='🎉';document.getElementById('heading').textContent='PARABÉNS! VOCÊ GANHOU!';document.getElementById('description').textContent='Seu presente da Bambinno é:';document.getElementById('prize').textContent=premios[codigo];document.getElementById('prize').style.display='block';botao.style.display='none';const card=document.getElementById('card');for(let i=0;i<65;i++){const el=document.createElement('span');el.className='confetti';el.style.left=Math.random()*100+'%';el.style.background=['#e33342','#103b83','#ffcb3e','#46b5a7'][i%4];el.style.animationDelay=Math.random()*.8+'s';card.appendChild(el);setTimeout(()=>el.remove(),3500)}},900)})}
</script></body></html>
